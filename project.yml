name: River
options:
  bundleIdPrefix: com.example.river
  deploymentTarget:
    iOS: "17.0"
packages:
  GameCore:
    path: GameCore
schemes:
  River:
    build:
      targets:
        River: all
    test:
      targets:
        - RiverUITests
    run:
      config: Debug
  RiverMessages:
    build:
      targets:
        RiverMessages: all
    run:
      config: Debug
targets:
  # Plain iOS demo app (hot-seat vs bots) — fastest way to iterate on the UI.
  River:
    type: application
    platform: iOS
    sources:
      - River
    dependencies:
      - package: GameCore
        product: HoldemUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.river.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "River"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  RiverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RiverUITests
    dependencies:
      - target: River
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.river.app.uitests
        TEST_TARGET_NAME: River
        CODE_SIGNING_ALLOWED: NO

  # Standalone iMessage app host (no home-screen icon, like GamePigeon).
  RiverMessages:
    type: application.messages
    platform: iOS
    sources:
      - MessagesHost
    dependencies:
      - target: RiverMessagesExtension
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.river.imsg
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "River"

  # The Messages extension that actually runs the game in a conversation.
  RiverMessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - MessagesExtension
    dependencies:
      - package: GameCore
        product: GameCore
      - package: GameCore
        product: HoldemUI
    settings:
      base:
        INFOPLIST_FILE: MessagesExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.river.imsg.extension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
