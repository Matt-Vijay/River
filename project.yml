name: River
options:
  bundleIdPrefix: com.dewylabs
  deploymentTarget:
    iOS: "17.0"
packages:
  GameCore:
    path: GameCore
schemes:
  River:
    build:
      targets:
        River: all
    test:
      targets:
        - RiverUITests
    run:
      config: Debug
  RiverMessages:
    build:
      targets:
        RiverMessages: all
    test:
      targets:
        - RiverMessagesInteractionTests
    run:
      config: Debug
targets:
  # Plain iOS pass-and-play app — fastest way to iterate on the UI.
  River:
    type: application
    platform: iOS
    sources:
      - River
      - AppAssets.xcassets
      - PrivacyInfo.xcprivacy
    dependencies:
      - package: GameCore
        product: HoldemUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river.standalone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: River.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "River"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  RiverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RiverUITests
    dependencies:
      - target: River
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river.standalone.uitests
        TEST_TARGET_NAME: River
        CODE_SIGNING_ALLOWED: NO

  # Standalone iMessage app host (no home-screen icon, like GamePigeon).
  RiverMessages:
    type: application.messages
    platform: iOS
    sources:
      - AppAssets.xcassets
    dependencies:
      - target: RiverMessagesExtension
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "River"

  # The Messages extension that actually runs the game in a conversation.
  RiverMessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - MessagesExtension
      - MessagesExtensionAssets
      - PrivacyInfo.xcprivacy
    dependencies:
      - package: GameCore
        product: GameCore
      - package: GameCore
        product: HoldemUI
    settings:
      base:
        INFOPLIST_FILE: MessagesExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river.messages
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        CODE_SIGN_ENTITLEMENTS: River.entitlements

  RiverMessagesInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RiverMessagesInteractionTests
    dependencies:
      - target: RiverMessages
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river.uitests
        TEST_TARGET_NAME: RiverMessages
        CODE_SIGNING_ALLOWED: NO
