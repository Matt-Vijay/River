name: River
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: '6.0'
  MARKETING_VERSION: '2.0'
  CURRENT_PROJECT_VERSION: '2'
  TARGETED_DEVICE_FAMILY: '1,2'
packages:
  RiverKit:
    path: RiverKit
targets:
  River:
    type: application
    platform: iOS
    sources: [App, Config/PrivacyInfo.xcprivacy]
    dependencies:
      - package: RiverKit
        product: RiverUI
      - target: RiverMessages
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Config/River.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dewylabs.river]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: River
        UIUserInterfaceStyle: Dark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  RiverMessages:
    type: app-extension.messages
    platform: iOS
    sources: [Messages, Config/PrivacyInfo.xcprivacy]
    dependencies:
      - package: RiverKit
        product: RiverUI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river.messages
      APPLICATION_EXTENSION_API_ONLY: true
      ASSETCATALOG_COMPILER_APPICON_NAME: 'iMessage App Icon'
    entitlements:
      path: Config/River.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dewylabs.river]
    info:
      path: Messages/Info.plist
      properties:
        CFBundleDisplayName: River
        UIUserInterfaceStyle: Dark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
  RiverTests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: River
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river.tests
      GENERATE_INFOPLIST_FILE: true
schemes:
  River:
    build:
      targets:
        River: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [RiverTests]
      gatherCoverageData: false
