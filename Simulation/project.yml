name: RiverSimulation
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '6.0'
  TARGETED_DEVICE_FAMILY: '1'
packages:
  RiverKit:
    path: ../RiverKit
targets:
  RiverSimulation:
    type: application
    platform: iOS
    sources: [Sources, ../App/Assets.xcassets]
    dependencies:
      - package: RiverKit
        product: RiverUI
      - package: RiverKit
        product: Poker
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dewylabs.river.simulation
      GENERATE_INFOPLIST_FILE: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: River Local
      INFOPLIST_KEY_UIUserInterfaceStyle: Dark
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  RiverSimulation:
    build:
      targets:
        RiverSimulation: all
